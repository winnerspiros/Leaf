name: Build Leaf max-perf (fork)

on:
  push:
    branches: [ "ver/26.3" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Create PaperclipJar
        run: ./gradlew createPaperclipJar --stacktrace --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: leaf-maxperf-paperclip
          path: leaf-server/build/libs/leaf-paperclip-*.jar
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Auto-version: v26.3.<patch> incrementing from existing tags
          LAST=$(gh release list --limit 100 2>/dev/null | grep -oP 'v26\.3\.\d+' | sort -t. -k3 -n | tail -1)
          if [ -z "$LAST" ]; then NEXT="v26.3.1"; else N=$(echo "$LAST" | cut -d. -f3); NEXT="v26.3.$((N+1))"; fi
          TAG="$NEXT"
          # Version marker file
          echo "${{ github.sha }}" > leaf-maxperf-version.txt
          echo "build ${{ github.run_number }} $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> leaf-maxperf-version.txt
          # Changelog: our patches grouped (subjects from patch filenames)
          CHANGELOG="## Changes vs upstream Leaf 26.3\n\n"
          CHANGELOG+="### Our cherry-picked ports (not in upstream Leaf)\n"
          for p in leaf-server/minecraft-patches/features/03[4-9]*.patch leaf-server/minecraft-patches/features/04*.patch; do
            [ -f "$p" ] || continue
            SUBJ=$(grep -m1 "^Subject:" "$p" | sed 's/Subject: \[PATCH\] //')
            CHANGELOG+="- $SUBJ\n"
          done
          CHANGELOG+="\n### Recent commits\n$(git log -10 --format='- %s')\n"
          printf "%b" "$CHANGELOG" > maxperf-changelog.md
          NOTES="$(printf "%b" "$CHANGELOG")"
          gh release create "$TAG" leaf-server/build/libs/leaf-paperclip-*.jar \
            --title "Leaf max-perf 26.3 ($TAG)" \
            --notes "$NOTES"
          # Roll the 'current' pointer to this build
          gh release delete maxperf-26.3-current -y 2>/dev/null || true
          git tag -f maxperf-26.3-current 2>/dev/null || true
          gh release create maxperf-26.3-current leaf-server/build/libs/leaf-paperclip-*.jar \
            --title "Leaf max-perf 26.3 (current)" \
            --notes "$NOTES" \
            --latest || true
