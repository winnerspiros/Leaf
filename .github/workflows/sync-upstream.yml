name: Sync upstream Leaf + rebuild max-perf

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Winds-Studio/Leaf.git 2>/dev/null || true
          git fetch upstream ver/26.3
          echo "UPSTREAM_SHA=$(git rev-parse upstream/ver/26.3)" >> $GITHUB_ENV
          echo "BASE_SHA=$(git merge-base ver/26.3 upstream/ver/26.3)" >> $GITHUB_ENV
      - name: Check for upstream movement
        id: check
        run: |
          git checkout ver/26.3
          if [ "$UPSTREAM_SHA" = "$(git rev-parse ver/26.3)" ]; then
            echo "moved=false" >> $GITHUB_OUTPUT
            echo "Upstream unchanged, nothing to do."
          else
            echo "moved=true" >> $GITHUB_OUTPUT
          fi
      - name: Attempt rebase onto upstream
        id: rebase
        if: steps.check.outputs.moved == 'true'
        run: |
          git config user.email "no-reply@github.com"
          git config user.name "Github Actions"
          git rebase upstream/ver/26.3 ver/26.3 && echo "clean=true" >> $GITHUB_OUTPUT || echo "clean=false" >> $GITHUB_OUTPUT
      - name: Push clean rebase
        if: steps.check.outputs.moved == 'true' && steps.rebase.outputs.clean == 'true'
        run: git push origin ver/26.3 --force-with-lease
      - name: Open conflict PR
        if: steps.check.outputs.moved == 'true' && steps.rebase.outputs.clean != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          git rebase --abort || true
          BR="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BR" upstream/ver/26.3
          git cherry-pick ver/26.3..upstream/ver/26.3 2>/dev/null || true
          git push origin "$BR" --force
          gh pr create --title "Upstream sync $(date +%Y-%m-%d): rebase conflicts need manual fix" \
            --body "Upstream ver/26.3 moved to $UPSTREAM_SHA. Auto-rebase failed — resolve conflicts on this branch, then fast-forward ver/26.3." \
            --base ver/26.3 --head "$BR" || true
